<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Not found — Baby Strachan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Work+Sans:wght@400;600&family=Yellowtail&display=swap">
<style>
:root{ --olive:#44512F; --olive-ink:#2F3920; --sage:#687647; --ivory:#FCFBF4;
  --ivory-sunk:#F4F2E6; --muted:#5E6B47; --gingham:rgba(112,130,80,.22); color-scheme:light; }
*{box-sizing:border-box;}
body{margin:0;min-height:100dvh;display:grid;place-items:center;
  font-family:'Work Sans',system-ui,sans-serif;color:var(--olive);background:var(--ivory-sunk);
  background-image:repeating-linear-gradient(90deg,var(--gingham) 0 26px,transparent 26px 52px),
                   repeating-linear-gradient(0deg,var(--gingham) 0 26px,transparent 26px 52px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;}
.card{background:var(--ivory);border-radius:20px;box-shadow:0 8px 28px rgba(47,57,32,.14);
  padding:44px 30px;max-width:420px;width:100%;text-align:center;}
.brand{font-family:'Yellowtail',cursive;font-size:30px;color:var(--sage);line-height:1;}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--olive-ink);margin:16px 0 0;}
p{color:var(--muted);line-height:1.6;margin:10px 0 0;}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;
  margin-top:24px;border-radius:999px;background:var(--olive);color:var(--ivory);
  text-decoration:none;font-weight:600;letter-spacing:.01em;}
a:hover{background:var(--olive-ink);}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Baby Strachan</div>
    <h1>Nothing here</h1>
    <p>That page doesn't exist — but the guessing game does.</p>
    <a href="/">Make your guesses</a>
  </div>
</body>
</html>
